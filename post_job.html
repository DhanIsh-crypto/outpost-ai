{% extends "base.html" %}
{% block title %}Post a job - {{ APP_NAME }}{% endblock %}
{% block body %}
<div class="app-shell">
  {% include "provider/_sidebar.html" %}
  <main class="main-content">

    <div class="page-header">
      <div>
        <div class="page-title">Post a job</div>
        <div class="page-subtitle">Reach vetted freelancers across dev, design, marketing, data &amp; more.</div>
      </div>
      <a href="{{ url_for('provider_jobs') }}" class="btn">&larr; Back to jobs</a>
    </div>

    <div class="card">
      <form method="POST" action="{{ url_for('post_job') }}">
        <div class="form-group">
          <label class="form-label">Job title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Senior React Engineer for SaaS Dashboard" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select name="category" class="form-control">
              <option>Web Development</option>
              <option>Mobile Development</option>
              <option>Design</option>
              <option>Writing</option>
              <option>Marketing</option>
              <option>Data &amp; AI</option>
              <option>DevOps &amp; Cloud</option>
              <option>Video &amp; Animation</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Budget</label>
            <input type="text" name="budget" class="form-control" placeholder="e.g. $8,000 or $75/hr" required>
          </div>
          <div class="form-group">
            <label class="form-label">Duration</label>
            <input type="text" name="duration" class="form-control" placeholder="e.g. 3 months, ongoing" required>
          </div>
          <div class="form-group">
            <label class="form-label">Experience level</label>
            <select name="experience_level" class="form-control">
              <option>Entry</option>
              <option selected>Intermediate</option>
              <option>Expert</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Location type</label>
            <select name="location_type" class="form-control">
              <option selected>Remote</option>
              <option>Onsite</option>
              <option>Hybrid</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Skills required (comma separated)</label>
          <input type="text" name="skills_required" class="form-control" placeholder="React, TypeScript, REST API">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="8"
                    placeholder="Describe the project, deliverables, must-haves and any context the freelancer should know."></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">&#128188; Publish job</button>
      </form>
    </div>

  </main>
</div>
{% endblock %}
