{% extends "base.html" %}
{% block title %}Create account - {{ APP_NAME }}{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:24px;">
      <span class="brand-logo">O</span>
      <div>
        <div style="font-weight:800;font-size:18px;">OUTPOST <strong>AI</strong></div>
        <div class="text-muted small">Join the platform</div>
      </div>
    </div>

    <h2 class="auth-title">Create your account</h2>
    <p class="auth-subtitle">Pick the role that fits you.</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label">I am a</label>
        <div class="role-picker">
          <label class="role-option selected">
            <input type="radio" name="role" value="client" checked>
            <div class="role-option-title">Freelancer</div>
            <div class="role-option-sub">Find clients</div>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="provider">
            <div class="role-option-title">Job Provider</div>
            <div class="role-option-sub">Hire talent</div>
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Full name</label>
        <input type="text" name="name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Growth Specialist">
        </div>
        <div class="form-group">
          <label class="form-label">Company</label>
          <input type="text" name="company" class="form-control" placeholder="e.g. Independent">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Create account</button>
    </form>

    <div class="auth-divider">or</div>
    <p class="text-center text-muted small">Already have an account?
      <a href="{{ url_for('login') }}" style="font-weight:600;color:var(--text);">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
